{{define "content"}}<div class="page notif-page" data-notif-page>
  <h1>{{index .T "notif.title"}}</h1>
  <p class="lead">{{index .T "notif.page_lead"}}</p>
  <div class="list-tools" role="search">
    <label class="list-search">{{index .T "list.search_label"}}
      <input type="search" data-np-q placeholder="{{index .T "list.search"}}" autocomplete="off"></label>
    <label class="list-select">{{index .T "notif.filter_kind"}}
      <select data-np-kind>
        <option value="all">{{index .T "cal.status_all"}}</option>
        <option value="available">{{index .T "notif.available"}}</option>
        <option value="upgraded">{{index .T "notif.upgraded"}}</option>
      </select></label>
    <label class="list-select">{{index .T "notif.filter_state"}}
      <select data-np-state>
        <option value="all">{{index .T "cal.status_all"}}</option>
        <option value="unread">{{index .T "notif.unread_only"}}</option>
        <option value="read">{{index .T "notif.read_only"}}</option>
      </select></label>
    <label class="list-select">{{index .T "list.sort"}}
      <select data-np-sort>
        <option value="new">{{index .T "notif.sort_new"}}</option>
        <option value="old">{{index .T "notif.sort_old"}}</option>
        <option value="title">{{index .T "notif.sort_title"}}</option>
      </select></label>
  </div>
  <div class="np-bar">
    <label class="check np-all"><input type="checkbox" data-np-all> {{index .T "notif.select_all"}}</label>
    <button class="btn btn-sm" type="button" data-np-read disabled></button>
    <button class="btn btn-sm btn-danger" type="button" data-np-delete disabled></button>
    <button class="btn btn-sm btn-ghost" type="button" data-np-delete-all>{{index .T "notif.delete_all"}}</button>
  </div>
  <p class="list-count" data-np-count role="status"></p>
  <ul class="notif-list np-list" data-np-items aria-busy="true"></ul>
  <p class="list-empty" data-np-empty hidden>{{index .T "notif.empty"}}</p>
</div>{{end}}
