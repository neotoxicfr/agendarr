name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".golangci.yml"
      - "lefthook.yml"
      - "Makefile"
      - ".claude/**"
      - ".github/workflows/**"
      - "!.github/workflows/docker-publish.yml"
      - ".github/dependabot.yml"
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel superseded branch builds; never cancel tag (release) builds
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The image that reaches production must not ship on a red build. ci.yml runs
  # in parallel on the same push and has no relationship to this workflow, so a
  # failing test suite would previously still publish :dev — the tag production
  # pulls. This job is the gate.
  verify:
    name: Test before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -timeout 120s ./...

      # A known vulnerability must not reach production either. Keep this
      # version in step with ci.yml and with the Go version in go.mod.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No QEMU step: the builder stage is pinned to $BUILDPLATFORM and
      # cross-compiles via GOOS/GOARCH, and the final stage is FROM distroless with
      # no RUN, so no target-architecture code ever executes during the build.
      # Emulation bought nothing and pulled docker.io/tonistiigi/binfmt:latest —
      # a mutable tag, executed privileged, in the one job holding packages:write.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64,linux/arm/v7' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Real attestation manifests rather than the inline-only provenance
          # that build-push-action defaults to on a private repository.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
