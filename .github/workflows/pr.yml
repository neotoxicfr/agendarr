name: Pull request

# Every pull request runs ci.yml. Once it passes, one from Dependabot is
# squash-merged into dev, and so is one from the owner once CodeRabbit has
# really reviewed its head commit; a draft is left alone, and so is anything
# that fails. Nothing is ever merged into main from here.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # No checkout: this job never runs the code of the pull request.
  merge:
    name: Merge into dev
    needs: ci
    if: >-
      !github.event.pull_request.draft && (
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == github.repository_owner &&
      github.base_ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # A Dependabot security update opens against main, the default branch.
      - name: Retarget to dev
        if: github.base_ref != 'dev'
        run: gh api -X PATCH "repos/$GH_REPO/pulls/$PR" -f base=dev --silent

      # CodeRabbit skips Dependabot (.coderabbit.yaml). For the owner, only a
      # `success` check means the head commit was reviewed: a skipped, rate-limited
      # (neutral), failed or cancelled review is not one, and neither is a check
      # that has not come after 20 minutes. Without a review the job fails and the
      # pull request stays open: comment `@coderabbitai full review` as the owner
      # (CodeRabbit ignores it from github-actions[bot]), then re-run this job.
      - name: Wait for CodeRabbit's review
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          for _ in $(seq 60); do
            c=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?check_name=CodeRabbit" --jq \
              '.check_runs | select(length > 0 and all(.status == "completed")) | max_by(.id).conclusion') &&
              [ -n "$c" ] && break
            sleep 20
          done
          [ "$c" = success ] || { echo "::error::CodeRabbit did not review $SHA: not merged"; exit 1; }

      - name: Squash-merge
        run: gh pr merge "$PR" --squash --match-head-commit "$SHA"

      # A merge made with GITHUB_TOKEN raises no push event.
      - name: Publish the dev image
        run: gh workflow run docker-publish.yml --ref dev
