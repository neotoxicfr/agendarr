name: CI

# Pull requests run it here; pushes to dev and release tags run it through
# docker-publish.yml, which publishes nothing unless it passes.
on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".github/dependabot.yml"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -timeout 120s ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # Pinned rather than via golang/govulncheck-action, which installs
      # govulncheck@latest on every run. Bump alongside the Go version, after
      # the same week of cooldown as Dependabot.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  security-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Trivy image, pinned by digest, rather than trivy-action: the action
      # installs the binary from get.trivy.dev, whose outage on 04/11/2026
      # blocked a release. Bump the tag and digest by hand (docker buildx
      # imagetools inspect ghcr.io/aquasecurity/trivy:<version>).
      # --ignore-unfixed: a vulnerability with no fixed version yet cannot be
      # acted on; it must not hold back every image until upstream ships one.
      - name: Run Trivy scanner
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          fs --scanners vuln,secret,misconfig --severity CRITICAL,HIGH
          --ignore-unfixed --exit-code 1 /src
