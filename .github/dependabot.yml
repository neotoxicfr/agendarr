version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # A week before proposing a new release: a compromised version is usually
    # caught by then, and a merge on dev ships to production.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # A week before proposing a new release: a compromised version is usually
    # caught by then, and a merge on dev ships to production.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One pull request for the routine bumps; a major version gets its own.
    groups:
      go-modules:
        update-types: ["minor", "patch"]
    # A week before proposing a new release: a compromised version is usually
    # caught by then, and a merge on dev ships to production.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
