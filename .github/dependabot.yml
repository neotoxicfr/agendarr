version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    # No waiting period: without this, a release waits 3 days by default.
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    # No waiting period: without this, a release waits 3 days by default.
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    # No waiting period: without this, a release waits 3 days by default.
    cooldown:
      exclude: ["*"]
    open-pull-requests-limit: 5
    # One pull request for the routine bumps; a major version gets its own.
    groups:
      go-modules:
        update-types: ["minor", "patch"]
        # goose can raise modernc.org/libc past the version sqlite pins (ci.yml
        # checks it): on its own, it waits without holding back the others.
        exclude-patterns: ["github.com/pressly/goose/v3"]
    ignore:
      # Untagged sub-module, kept at a pseudo-version: Dependabot resolves a
      # tag of the parent module and its run fails every day.
      - dependency-name: "github.com/alexedwards/scs/sqlite3store"
    commit-message:
      prefix: "chore(deps)"
